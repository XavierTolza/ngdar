[package]
name = "ngdar"
version = "0.0.0"
edition = "2021"
description = "New Generation Disk Archiving - Git-like incremental archiving for massive binary files"
authors = ["Xavier <xavier@example.com>"]

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
walkdir = "2"
tar = "0.4"
regex = "1"
csv = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
