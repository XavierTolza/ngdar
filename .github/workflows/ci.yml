name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  # Called by the "Release" orchestrator to validate the release branch
  # before merging it. We call it explicitly because a pull request
  # created with the default GITHUB_TOKEN does not trigger `pull_request`
  # workflows (GitHub's anti-recursion rule).
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch/commit) to validate. Defaults to the triggering commit."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint + docs + tests on the reference platform. These checks are the
  # gate the release pipeline waits for before merging a release PR.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --document-private-items

      - name: Run unit tests
        run: cargo test

      - name: Run E2E tests
        run: cargo test --test e2e

  # Build the portable, fully static Linux binary and prove it actually runs
  # in an empty environment (a `scratch` container with no libc/shell/tools).
  # This is the gate that guarantees the artefact shipped to users is
  # standalone.
  standalone-linux:
    uses: ./.github/workflows/standalone-linux.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # Test on every OS we ship binaries for, so a release cannot go out
  # broken because of a platform-specific regression.
  test-matrix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test

      - name: Run E2E tests
        run: cargo test --test e2e
