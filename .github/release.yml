# Categorises the notes that GitHub auto-generates for each release
# (used by `gh release create --generate-notes`).
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: "🚀 Features"
      labels: ["feature", "enhancement"]
    - title: "🐛 Fixes"
      labels: ["fix", "bug"]
    - title: "📚 Documentation"
      labels: ["documentation", "docs"]
    - title: "🧰 Maintenance"
      labels: ["chore", "refactor", "ci", "dependencies"]
    - title: "Other changes"
      labels: ["*"]
